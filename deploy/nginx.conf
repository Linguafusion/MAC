server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques du build Vite
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers versionnés (hachés) du dossier assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
